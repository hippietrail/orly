[package]
name = "Orly"
version = "0.1.0"
edition = "2024"

[dependencies]
# UI & HTTP
gpui-kit = { version = "0.7", features = ["inspector", "tree-sitter"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "0.3" }

# Utilities & Parsing
anyhow = "1.0.102"
bytes = "1.11.1"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3.32"
markdown = { version = "1.0.0", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
scraper = "0.27.0"
serde_json = "1.0.150"
url = "2.5.8"
